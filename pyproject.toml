[project]
name = "turn-engine"
version = "0.3.0"
description = "문진 시스템 한 턴의 판단 로직(순수 함수 라이브러리, I8)"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",
    "boundary-contracts @ git+ssh://git@github.com/Sdabin1209/openit_boundary-contracts.git@v2.0.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["turn_engine"]

[tool.setuptools.package-data]
turn_engine = ["_schemas/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:turn_engine\\.:DeprecationWarning"]
